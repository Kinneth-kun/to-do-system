<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Never serve the application, its config or its data over HTTP.
    <DirectoryMatch "^/var/www/html/(app|bootstrap|config|database|docker|resources|routes|storage|tests|vendor)">
        Require all denied
    </DirectoryMatch>

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
